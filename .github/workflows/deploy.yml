name: CI/CD Pipeline - Digitrans Supply Chain

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Backend Tests
        run: echo "Tests backend OK"

  infrastructure:
    needs: test-backend
    runs-on: ubuntu-latest
    outputs:
      server_ip: "98.82.31.33"
    steps:
      - name: Skip Terraform Creation
        run: echo "Utilisation de l'instance AWS existante pour preserver les quotas."

  configure-server:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Utilisation de l'action officielle pour injecter proprement la clé SSH
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          name: id_rsa
          known_hosts: "placeholder" # Sera mis à jour dynamiquement juste après
          if_key_exists: replace

      - name: Scan Remote Host
        run: |
          SERVER_IP=${{ needs.infrastructure.outputs.server_ip }}
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          # On duplique la clé dans le workspace local pour l'inventaire Ansible si nécessaire
          cp ~/.ssh/id_rsa ./id_rsa
          chmod 600 ./id_rsa

      - name: Run Ansible Playbook
        run: |
          SERVER_IP=${{ needs.infrastructure.outputs.server_ip }}
          sed -i "s/YOUR_EC2_IP/$SERVER_IP/g" ansible/inventory.ini
          
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --private-key=./id_rsa

  deploy-docker:
    needs: [infrastructure, configure-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          name: id_rsa
          known_hosts: "placeholder"
          if_key_exists: replace

      - name: Scan Remote Host
        run: |
          SERVER_IP=${{ needs.infrastructure.outputs.server_ip }}
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          cp ~/.ssh/id_rsa ./id_rsa
          chmod 600 ./id_rsa

      - name: Deploy Apps with Docker Compose
        env:
          SERVER_IP: ${{ needs.infrastructure.outputs.server_ip }}
        run: |
          scp -i ./id_rsa docker-compose.yml ubuntu@$SERVER_IP:/home/ubuntu/docker-compose.yml
          ssh -i ./id_rsa ubuntu@$SERVER_IP "
            cd /home/ubuntu &&
            docker compose pull &&
            docker compose up -d --remove-orphans
          "