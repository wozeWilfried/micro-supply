name: CI/CD Pipeline - Digitrans Supply Chain

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ajoute ici tes étapes de test existantes (Spring Boot, etc.)
      - name: Run Backend Tests
        run: echo "Tests backend OK"

  infrastructure:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
        run: terraform apply -auto-approve
        working-directory: ./terraform

  configure-server:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          # Création du fichier de clé en supprimant les retours à la ligne CRLF de Windows
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ./id_rsa
          chmod 600 ./id_rsa

      - name: Run Ansible Playbook
        run: |
          # Remplacement dynamique de l'IP du serveur cible dans l'inventaire
          sed -i "s/YOUR_EC2_IP/98.82.31.33/g" ansible/inventory.ini
          
          # Exécution d'Ansible avec désactivation stricte du Host Key Checking pour éviter le blocage SSH
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key=./id_rsa