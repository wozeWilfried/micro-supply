name: CI/CD Pipeline - Digitrans Supply Chain

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Backend Tests
        run: echo "Tests backend OK"

  infrastructure:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
        run: terraform apply -auto-approve
        working-directory: ./terraform

  configure-server:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Écrit proprement la clé sans casser le formatage Linux
          echo "$SSH_PRIVATE_KEY" > ./id_rsa
          # Supprime définitivement les retours à la ligne Windows invisibles (\r)
          sed -i 's/\r$//' ./id_rsa
          chmod 600 ./id_rsa

      - name: Run Ansible Playbook
        run: |
          # Remplacement dynamique de l'IP cible
          sed -i "s/YOUR_EC2_IP/34.201.1.66/g" ansible/inventory.ini
          
          # Exécution d'Ansible avec désactivation du Host Key Checking
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key=./id_rsa
