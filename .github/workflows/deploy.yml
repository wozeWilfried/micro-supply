name: CI/CD Pipeline - Digitrans Supply Chain

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Backend Tests
        run: echo "Tests backend OK"

  infrastructure:
    needs: test-backend
    runs-on: ubuntu-latest
    outputs:
      server_ip: "98.82.31.33" # Conserve ton IP active ou laisse la détection dynamique
    steps:
      - name: Skip Terraform Creation
        run: echo "Utilisation de l'instance AWS existante pour preserver les quotas."

  configure-server:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Écriture propre et suppression stricte des sauts de ligne Windows corrompus
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # On copie aussi la clé à la racine du workspace au cas où Ansible la cherche de manière absolue
          cp ~/.ssh/id_rsa ./id_rsa
          chmod 600 ./id_rsa
          
          SERVER_IP=${{ needs.infrastructure.outputs.server_ip }}
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Run Ansible Playbook
        run: |
          SERVER_IP=${{ needs.infrastructure.outputs.server_ip }}
          sed -i "s/YOUR_EC2_IP/$SERVER_IP/g" ansible/inventory.ini
          
          # Exécution en forçant l'utilisation de la clé nettoyée du workspace local
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --private-key=./id_rsa

  deploy-docker:
    needs: [infrastructure, configure-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cp ~/.ssh/id_rsa ./id_rsa
          
          SERVER_IP=${{ needs.infrastructure.outputs.server_ip }}
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Deploy Apps with Docker Compose
        env:
          SERVER_IP: ${{ needs.infrastructure.outputs.server_ip }}
        run: |
          scp -i ./id_rsa docker-compose.yml ubuntu@$SERVER_IP:/home/ubuntu/docker-compose.yml
          ssh -i ./id_rsa ubuntu@$SERVER_IP "
            cd /home/ubuntu &&
            docker compose pull &&
            docker compose up -d --remove-orphans
          "