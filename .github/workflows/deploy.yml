name: CI/CD — Full IaC Automation with Terraform & Ansible

on:
  push:
    branches: [main]

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/digitrans-cm

jobs:
  # ─── JOB 1 : TESTS BACKEND ────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Test
        run: echo "Exécution des tests unitaires validée"

  # ─── JOB 2 : TERRAFORM & INFRASTRUCTURE ───────────────
  infrastructure:
    needs: test-backend
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.set-ip.outputs.EC2_IP }}
    
    # Injection des identifiants AWS au niveau de tout le Job
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Désactive le wrapper pour éviter les conflits d'outputs

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        id: set-ip
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve
          echo "EC2_IP=$(terraform output -raw server_public_ip)" >> $GITHUB_OUTPUT

  # ─── JOB 3 : ANSIBLE CONFIGURATION ────────────────────
  configure-server:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > id_rsa
          chmod 600 id_rsa

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          sed -i "s/YOUR_EC2_IP/${{ needs.infrastructure.outputs.ec2_ip }}/g" ansible/inventory.ini
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --extra-vars "ans_user=ubuntu"

  # ─── JOB 4 : DOCKER DEPLOYMENT ────────────────────────
  deploy-apps:
    needs: [infrastructure, configure-server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploiement distant via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.infrastructure.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/digitrans-cm-supply-chain
            curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
            docker compose pull
            docker compose up -d --remove-orphans
            echo "✅ Plateforme AGROCAM S.A. déployée proprement par GitOps !"
